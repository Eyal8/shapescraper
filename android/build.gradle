// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // Optional private CI copy of the exact tested SDK. All other artifacts
        // still resolve from their normal repositories with original POM deps.
        if (rootProject.file('.gradle/age-signals-maven').isDirectory()) {
            exclusiveContent {
                forRepository {
                    maven { url = rootProject.uri('.gradle/age-signals-maven') }
                }
                filter { includeVersion('com.google.android.play', 'age-signals', '0.0.5') }
            }
        }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
