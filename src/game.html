<title>Shapescraper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D canvas, HUD floats over it; one look, hue shifts as the tower grows */
:root {
  --h: 200;
  --ink: #ffffff;
  --ink-soft: rgba(255,255,255,0.82);
  --ink-dark: #22283a;
  --shadow: rgba(20, 24, 40, 0.22);
  --chip: rgba(255,255,255,0.22);
  --chip-line: rgba(255,255,255,0.45);
  --warn: #fff1c2;
  --bg-fallback: #9cc7dd;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0;
  background-color: var(--bg-fallback);
  background: linear-gradient(180deg, hsl(var(--h) 60% 86%), hsl(calc(var(--h) + 35) 48% 64%));
  color: var(--ink);
  transition: background 0.8s;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  font-family: var(--mono);
}
[hidden] { display: none !important; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: fixed; inset: 0; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 28px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center;
  text-shadow: 0 2px 12px var(--shadow);
}
#score {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(56px, 18vw, 96px); line-height: 1;
  font-variant-numeric: tabular-nums;
  transition: transform 0.15s;
}
#score.bump { transform: scale(1.12); }
#sub {
  margin-top: 8px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-soft); font-variant-numeric: tabular-nums; text-align: center;
}
#sub.timer { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: 0.02em; color: var(--ink); }
#sub.warn { color: var(--warn); }
#popup {
  margin-top: 10px; font-family: var(--display); font-weight: 500;
  font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; text-align: center;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.2s, transform 0.2s;
}
#popup.show { opacity: 1; transform: none; }
.panel {
  margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px;
  text-align: center; width: 100%;
}
.panel h1 {
  margin: 0; font-family: var(--display); font-weight: 800;
  font-size: clamp(32px, 10vw, 60px); line-height: 0.95; letter-spacing: -0.01em;
  text-wrap: balance;
}
.label { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.big { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 36px; }
.stats > div { display: flex; flex-direction: column; gap: 6px; }
.seg {
  display: flex; width: min(340px, 100%); padding: 3px; margin-top: 6px;
  background: var(--chip); border: 1px solid var(--chip-line); border-radius: 999px;
}
.seg-btn {
  flex: 1; pointer-events: auto; cursor: pointer; border: 0; background: none; color: var(--ink);
  font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
  padding: 10px 4px; border-radius: 999px; text-shadow: none;
}
.seg-btn[aria-checked="true"] { background: var(--ink); color: var(--ink-dark); }
.shapes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; width: min(340px, 100%); }
.shape {
  pointer-events: auto; cursor: pointer; position: relative; min-width: 0;
  padding: 10px 2px 7px; border-radius: 14px;
  background: var(--chip); border: 1px solid var(--chip-line); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  font: 500 9px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; text-shadow: none;
}
.shape svg { width: 26px; height: 26px; display: block; }
.shape .glyph { fill: currentColor; }
.shape span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shape[aria-checked="true"] { background: var(--ink); color: var(--ink-dark); border-color: var(--ink); }
.shape.locked .glyph { opacity: 0.35; }
.shape .lock { position: absolute; top: 5px; right: 5px; width: 11px; height: 11px; }
.shape .lock path { fill: none; stroke: currentColor; stroke-width: 2.2; }
.shape .lock rect { fill: currentColor; }
.seg-btn:focus-visible, .shape:focus-visible, .btn:focus-visible, #mute:focus-visible, .link-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#modeInfo {
  max-width: 330px; min-height: 2.9em; margin: 0;
  font-size: 13px; line-height: 1.45; letter-spacing: 0.02em; color: var(--ink);
}
.actions { display: flex; flex-direction: column; gap: 10px; width: min(300px, 100%); margin-top: 4px; }
.btn {
  pointer-events: auto; cursor: pointer;
  padding: 15px 20px; border-radius: 999px;
  background: var(--chip); border: 1px solid var(--chip-line); color: var(--ink);
  font: 500 13px var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
  text-shadow: none;
}
.btn.primary { background: var(--ink); color: var(--ink-dark); border-color: var(--ink); }
.btn.primary small { display: block; margin-top: 4px; font-size: 10px; letter-spacing: 0.1em; opacity: 0.6; }
.link-btn {
  pointer-events: auto; cursor: pointer; background: none; border: 0; padding: 8px 12px;
  color: var(--ink-soft); font: 500 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
  text-decoration: underline; text-underline-offset: 3px;
}
.row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
#mute {
  position: fixed; pointer-events: auto;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--chip); border: 1px solid var(--chip-line); color: var(--ink);
  font: 500 11px var(--mono); letter-spacing: 0.06em; cursor: pointer;
}
#adSim {
  position: fixed; inset: 0; z-index: 20; background: #101320; color: #fff;
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#adSim .adbox { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 320px; }
#adSim p { margin: 0; color: rgba(255,255,255,0.7); font-size: 13px; line-height: 1.5; }
#adClose { pointer-events: auto; }
#adClose:disabled { opacity: 0.4; }
@media (max-height: 700px) { .panel h1 { font-size: 30px; } .panel { gap: 9px; } #modeInfo { min-height: 0; } }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>

<canvas id="c" aria-label="Shapescraper game"></canvas>

<script>
// ---------- Ads: AdMob inside the app, a simulated ad in the browser ----------
window.Ads = (function () {
  const CONFIG = {
    // Shapescraper's AdMob ad units. While testing is true, Google's test ads are shown instead.
    android: { interstitial: 'ca-app-pub-5535097818156227/3884362464', rewarded: 'ca-app-pub-5535097818156227/8293460890' },
    ios: { interstitial: 'ca-app-pub-5535097818156227/4814300757', rewarded: 'ca-app-pub-5535097818156227/5751058031' },
    testing: true,
    interstitialEveryGames: 3,
    minSecondsBetweenInterstitials: 60
  };
  const cap = window.Capacitor;
  const platform = cap && cap.getPlatform ? cap.getPlatform() : 'web';
  const native = platform === 'android' || platform === 'ios';
  const AdMob = native && window.capacitorExports ? window.capacitorExports.registerPlugin('AdMob') : null;
  const ids = CONFIG[platform] || {};
  const ready = { interstitial: false, rewarded: false };
  let lastInterstitial = Date.now(); // never right at launch
  let privacyRequired = false; // UMP says players must be able to reopen ad privacy choices

  async function init() {
    if (!AdMob) return;
    try {
      await AdMob.initialize({ initializeForTesting: CONFIG.testing });
      try {
        let info = await AdMob.requestConsentInfo();
        if (info.isConsentFormAvailable && info.status === 'REQUIRED') info = await AdMob.showConsentForm();
        privacyRequired = info && info.privacyOptionsRequirementStatus === 'REQUIRED';
        document.dispatchEvent(new Event('ads:privacy'));
      } catch (e) {}
      if (platform === 'ios') {
        try {
          const t = await AdMob.trackingAuthorizationStatus();
          if (t.status === 'notDetermined') await AdMob.requestTrackingAuthorization();
        } catch (e) {}
      }
      preload('interstitial');
      preload('rewarded');
    } catch (e) { console.warn('AdMob init failed', e); }
  }

  async function preload(kind) {
    if (!AdMob || ready[kind]) return;
    try {
      const opts = { adId: ids[kind], isTesting: CONFIG.testing };
      if (kind === 'rewarded') await AdMob.prepareRewardVideoAd(opts);
      else await AdMob.prepareInterstitial(opts);
      ready[kind] = true;
    } catch (e) {
      ready[kind] = false;
      setTimeout(() => preload(kind), 30000);
    }
  }

  // Waits for one of the given plugin events (or a timeout), then cleans up listeners.
  function waitFor(events, onEvent, timeoutMs) {
    return new Promise((resolve) => {
      const subs = [];
      let finished = false;
      const finish = (name) => {
        if (finished) return;
        finished = true;
        subs.forEach((p) => Promise.resolve(p).then((s) => s && s.remove && s.remove()).catch(() => {}));
        setTimeout(() => resolve(name), 250);
      };
      Object.keys(events).forEach((name) => {
        subs.push(AdMob.addListener(name, (data) => {
          if (onEvent) onEvent(name, data);
          if (events[name]) finish(name);
        }));
      });
      setTimeout(() => finish('timeout'), timeoutMs);
    });
  }

  function simulate(seconds) {
    return new Promise((resolve) => {
      const box = document.getElementById('adSim');
      const count = document.getElementById('adCount');
      const close = document.getElementById('adClose');
      let left = seconds;
      count.textContent = left;
      close.disabled = true;
      box.hidden = false;
      const t = setInterval(() => {
        left--;
        count.textContent = Math.max(left, 0);
        if (left <= 0) { clearInterval(t); close.disabled = false; close.focus(); }
      }, 1000);
      close.onclick = () => { box.hidden = true; resolve(true); };
    });
  }

  async function showRewarded() {
    if (!AdMob) return simulate(5);
    if (!ready.rewarded) { await preload('rewarded'); if (!ready.rewarded) return false; }
    ready.rewarded = false;
    let earned = false;
    const done = waitFor(
      { onRewardedVideoAdReward: false, onRewardedVideoAdDismissed: true, onRewardedVideoAdFailedToShow: true },
      (name) => { if (name === 'onRewardedVideoAdReward') earned = true; },
      180000
    );
    AdMob.showRewardVideoAd().then((r) => { if (r && r.amount) earned = true; }).catch(() => {});
    await done;
    preload('rewarded');
    return earned;
  }

  async function maybeInterstitial(gamesPlayed) {
    const due = gamesPlayed > 0 && gamesPlayed % CONFIG.interstitialEveryGames === 0;
    const spaced = Date.now() - lastInterstitial > CONFIG.minSecondsBetweenInterstitials * 1000;
    if (!due || !spaced) return;
    lastInterstitial = Date.now();
    if (!AdMob) { await simulate(3); return; }
    if (!ready.interstitial) { preload('interstitial'); return; }
    ready.interstitial = false;
    const done = waitFor({ interstitialAdDismissed: true, interstitialAdFailedToShow: true }, null, 120000);
    AdMob.showInterstitial().catch(() => {});
    await done;
    preload('interstitial');
  }

  init();
  async function showPrivacyOptions() {
    if (!AdMob) return;
    try { await AdMob.showPrivacyOptionsForm(); } catch (e) {}
  }

  return {
    showRewarded, maybeInterstitial, showPrivacyOptions,
    privacyRequired: () => privacyRequired,
    isOpen: () => !document.getElementById('adSim').hidden
  };
})();
</script>
<script>
(function () {
  const H = 1;             // floor height
  const START = 3.2;       // starting square side
  const START_AREA = START * START;
  const RANGE = 7;         // how far moving blocks travel
  const PERFECT = 0.14;    // snap tolerance
  const MIN_SCORE_TO_CONTINUE = 5;
  const UNLOCK_SCORE = 15; // best Endless score in one shape that unlocks the next
  const TIME_START = 60, TIME_BONUS = 2, TIME_CONTINUE = 15;
  const PC = window.polygonClipping;

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- shapes, modes, progress ----------
  const SHAPES = ['square', 'circle', 'triangle', 'pentagon', 'hexagon'];
  const SHAPE_NAMES = { square: 'Square', circle: 'Circle', triangle: 'Triangle', pentagon: 'Pentagon', hexagon: 'Hexagon' };
  const SHAPE_HUE = { square: 200, circle: 330, triangle: 28, pentagon: 145, hexagon: 265 };
  const SHAPE_FEEL = {
    square: 'Classic slicing: the overhang is cut off in a straight line.',
    circle: 'Stays a circle. Every miss shrinks it, so perfects matter.',
    triangle: 'Stays a triangle. The points punish sloppy drops.',
    pentagon: 'Stays a pentagon. Five sides, five ways to slip.',
    hexagon: 'Stays a hexagon. Big, steady and satisfying when it lines up.'
  };
  const MODES = { endless: 'Endless', time: 'Time Attack', daily: 'Daily' };

  let mode = store.get('ss_mode2', 'endless');
  if (!MODES[mode]) mode = 'endless';
  let shape = store.get('ss_shape', 'square');
  if (!SHAPES.includes(shape)) shape = 'square';

  const bestKey = (m, s) => 'ss_best_' + m + '_' + s;
  function bestOf(m, s) {
    if (m === 'daily') return dailyState().best;
    const legacy = m === 'endless' && s === 'square' ? Math.max(store.get('ss_best_classic', 0) || 0, store.get('ts_best', 0) || 0) : 0;
    return store.get(bestKey(m, s), legacy) || 0;
  }
  function unlockedSet() { return store.get('ss_unlocked', ['square']); }
  function isUnlocked(s) {
    if (s === 'square' || unlockedSet().includes(s)) return true;
    const prev = SHAPES[SHAPES.indexOf(s) - 1];
    return bestOf('endless', prev) >= UNLOCK_SCORE;
  }
  function unlock(s) { const u = unlockedSet(); if (!u.includes(s)) { u.push(s); store.set('ss_unlocked', u); } }

  // ---------- daily: same shape, tower and goal for everyone, keyed by local date ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function dayKey(offset) {
    const d = new Date(); d.setDate(d.getDate() + (offset || 0));
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dailyConfig(key) {
    const r = mulberry32(hashStr('ss-daily-v2-' + key));
    const s = SHAPES[Math.floor(r() * SHAPES.length)];
    const g = r();
    let goal;
    if (g < 0.45) goal = { type: 'floors', n: 15 + Math.floor(r() * 11) };
    else if (g < 0.8) goal = { type: 'perfects', n: 6 + Math.floor(r() * 7) };
    else goal = { type: 'chain', n: 3 + Math.floor(r() * 3) };
    return { key, shape: s, goal, hue: Math.floor(r() * 360) };
  }
  function goalText(cfg) {
    const g = cfg.goal;
    return g.type === 'floors' ? 'Reach ' + g.n + ' floors'
      : g.type === 'perfects' ? 'Land ' + g.n + ' perfect drops'
      : 'Chain ' + g.n + ' perfects in a row';
  }
  function dailyState() {
    const s = store.get('ss_daily', null);
    return s && s.date === dayKey() ? s : { date: dayKey(), best: 0, done: false };
  }
  function streakNow() {
    const s = store.get('ss_streak', { count: 0, last: '' });
    return s.last === dayKey() || s.last === dayKey(-1) ? s.count : 0;
  }

  // ---------- 2D footprints (multipolygons in x/z) ----------
  const SIDES = { square: 4, triangle: 3, pentagon: 5, hexagon: 6, circle: 48 };
  const ROT = { square: Math.PI / 4, triangle: -Math.PI / 2, pentagon: -Math.PI / 2, hexagon: 0, circle: 0 };
  function regular(kind, a, cx, cz) {
    const n = SIDES[kind];
    const R = Math.sqrt((2 * a) / (n * Math.sin((2 * Math.PI) / n)));
    const ring = [];
    for (let i = 0; i < n; i++) { const t = ROT[kind] + (i * 2 * Math.PI) / n; ring.push([(cx || 0) + R * Math.cos(t), (cz || 0) + R * Math.sin(t)]); }
    return [[ring]];
  }
  function ringArea(r) { let a = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++) a += r[j][0] * r[i][1] - r[i][0] * r[j][1]; return Math.abs(a) / 2; }
  function polyArea(p) { let a = ringArea(p[0]); for (let k = 1; k < p.length; k++) a -= ringArea(p[k]); return a; }
  function area(mp) { let a = 0; for (const p of mp) a += polyArea(p); return a; }
  function centroid(mp) {
    let A = 0, cx = 0, cz = 0;
    for (const p of mp) {
      const r = p[0];
      for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
        const f = r[j][0] * r[i][1] - r[i][0] * r[j][1];
        A += f; cx += (r[j][0] + r[i][0]) * f; cz += (r[j][1] + r[i][1]) * f;
      }
    }
    if (Math.abs(A) < 1e-9) return [mp[0][0][0][0], mp[0][0][0][1]];
    return [cx / (3 * A), cz / (3 * A)];
  }
  const mapPts = (mp, fn) => mp.map((p) => p.map((r) => r.map(([x, z]) => fn(x, z))));
  const translate = (mp, dx, dz) => mapPts(mp, (x, z) => [x + dx, z + dz]);
  const clean = (mp) => (mp || []).filter((p) => polyArea(p) > 0.004);
  // Snap to a 1e-4 grid and drop repeated points: near-identical edges trip up the clipper.
  function snap(mp) {
    const q = (v) => Math.round(v * 1e4) / 1e4;
    return mp.map((p) => p.map((r) => {
      const out = [];
      for (const [x, z] of r) {
        const pt = [q(x), q(z)], prev = out[out.length - 1];
        if (!prev || prev[0] !== pt[0] || prev[1] !== pt[1]) out.push(pt);
      }
      if (out.length > 1 && out[0][0] === out[out.length - 1][0] && out[0][1] === out[out.length - 1][1]) out.pop();
      return out;
    }).filter((r) => r.length >= 3)).filter((p) => p.length);
  }
  function clip(op, a, b) {
    const A = snap(a);
    for (const [dx, dz] of [[0, 0], [3e-4, 1e-4], [-2e-4, 3e-4]]) {
      try { return snap(clean(PC[op](A, snap(translate(b, dx, dz))))); } catch (e) { /* retry with a tiny nudge */ }
    }
    return [];
  }
  // Largest copy of `kind` (same orientation) that fits inside `region`, tried at a few centres.
  function fitShape(kind, maxArea, region, centres) {
    const regionArea = area(region);
    let best = null;
    for (const [cx, cz] of centres) {
      let lo = 0, hi = 1;
      for (let i = 0; i < 14; i++) {
        const s = (lo + hi) / 2;
        const cand = regular(kind, maxArea * s * s, cx, cz);
        const outside = area(clip('difference', cand, region));
        if (outside < 0.0015 * Math.max(regionArea, 0.5)) lo = s; else hi = s;
      }
      if (lo > 0.02 && (!best || lo > best.s)) best = { s: lo, cx, cz };
    }
    return best ? { mp: regular(kind, maxArea * best.s * best.s, best.cx, best.cz), cx: best.cx, cz: best.cz, area: maxArea * best.s * best.s } : null;
  }

  // ---------- three.js setup ----------
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(5, 14, 3); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.22); fill.position.set(-8, 3, -2); scene.add(fill);
  const world = new THREE.Group(); scene.add(world);
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    const a = w / h, vh = Math.max(14, 11 / a), vw = vh * a;
    camera.left = -vw / 2; camera.right = vw / 2; camera.top = vh / 2; camera.bottom = -vh / 2;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // Extrudes a footprint into a floor; geometry is centred on (cx, cz) so it can spin and scale in place.
  function footprintGeo(mp, cx, cz) {
    const pts = (r) => {
      const out = r.map(([x, z]) => new THREE.Vector2(x - cx, -(z - cz)));
      if (out.length > 1 && out[0].distanceTo(out[out.length - 1]) < 1e-6) out.pop();
      return out;
    };
    const shapes = mp.map((p) => {
      const s = new THREE.Shape(pts(p[0]));
      for (let k = 1; k < p.length; k++) s.holes.push(new THREE.Path(pts(p[k])));
      return s;
    });
    const g = new THREE.ExtrudeGeometry(shapes, { depth: H, bevelEnabled: false, curveSegments: 1 });
    g.rotateX(-Math.PI / 2);
    g.translate(0, -H / 2, 0);
    return g;
  }
  function meshFor(mp, cx, cz, color) {
    const m = new THREE.Mesh(footprintGeo(mp, cx, cz), new THREE.MeshLambertMaterial({ color }));
    m.userData.ownGeo = true;
    world.add(m);
    return m;
  }
  function removeMesh(m) { world.remove(m); m.material.dispose(); if (m.userData.ownGeo) m.geometry.dispose(); }

  // ---------- game state ----------
  let state = 'menu';
  let stack = [], debris = [], rings = [], moving = null;
  let score = 0, combo = 0, perfects = 0, bestChain = 0, hueBase = 0, camY = 2, overAt = 0;
  let gamesPlayed = 0, continued = false, busy = false, timeLeft = 0;
  let runShape = 'square', dcfg = null, dailyJustDone = false, newlyUnlocked = null;

  const hueAt = (lvl) => (hueBase + lvl * 6) % 360;
  const colorAt = (lvl) => new THREE.Color().setHSL(hueAt(lvl) / 360, 0.62, 0.62);
  function setBg(lvl) { document.documentElement.style.setProperty('--h', Math.round(hueAt(lvl + 8))); }
  const topLayer = () => stack[stack.length - 1];

  function addLayer(mp, lvl) {
    const [cx, cz] = centroid(mp);
    const mesh = meshFor(mp, cx, cz, colorAt(lvl));
    mesh.position.set(cx, lvl * H, cz);
    return { mp, cx, cz, area: area(mp), mesh };
  }

  function reset() {
    while (world.children.length) removeMesh(world.children[0]);
    stack = []; debris = []; rings = []; moving = null;
    score = 0; combo = 0; perfects = 0; bestChain = 0; continued = false; dailyJustDone = false; newlyUnlocked = null;
    if (mode === 'daily') { dcfg = dailyConfig(dayKey()); runShape = dcfg.shape; hueBase = dcfg.hue; }
    else { dcfg = null; runShape = shape; hueBase = SHAPE_HUE[shape] + (Math.random() - 0.5) * 50; }
    timeLeft = TIME_START;
    const ped = new THREE.Mesh(boxGeo, new THREE.MeshLambertMaterial({ color: colorAt(0).offsetHSL(0, -0.1, -0.12) }));
    ped.scale.set(START, 30, START); ped.position.set(0, -H / 2 - 15, 0); world.add(ped);
    const first = regular(runShape, runShape === 'square' ? START_AREA : START_AREA * 0.86, 0, 0);
    stack.push(addLayer(first, 0));
    setBg(0);
    scoreEl.textContent = '0';
  }

  function spawnMoving() {
    const top = topLayer(), lvl = stack.length;
    const axis = lvl % 2 ? 'x' : 'z';
    const local = translate(top.mp, -top.cx, -top.cz);
    moving = { axis, local, lvl, off: -RANGE, dir: 1 };
    moving.mesh = meshFor(local, 0, 0, colorAt(lvl));
    moving.mesh.position.set(top.cx + (axis === 'x' ? moving.off : 0), lvl * H, top.cz + (axis === 'z' ? moving.off : 0));
    updateSub();
  }

  const speed = () => Math.min(4 + score * 0.14, 11.5);

  function addDebris(mp, y, color, axis, sign) {
    if (!mp.length) return;
    const [cx, cz] = centroid(mp);
    const mesh = meshFor(mp, cx, cz, color);
    mesh.position.set(cx, y, cz);
    debris.push({ mesh, vy: 0, vx: axis === 'x' ? sign * 1.5 : 0, vz: axis === 'z' ? sign * 1.5 : 0,
      rx: (Math.random() - 0.5) * 3, rz: (Math.random() - 0.5) * 3 });
  }

  function place() {
    const top = topLayer(), m = moving, lvl = m.lvl, y = lvl * H, color = colorAt(lvl);
    const dx = m.axis === 'x' ? m.off : 0, dz = m.axis === 'z' ? m.off : 0;
    const dropped = translate(m.local, top.cx + dx, top.cz + dz);
    const sign = Math.sign(m.off) || 1;
    removeMesh(m.mesh);
    moving = null;

    let placed;
    if (Math.abs(m.off) < PERFECT) {
      combo++; perfects++; bestChain = Math.max(bestChain, combo);
      placed = top.mp;
      if (combo >= 3 && top.area < START_AREA * (runShape === 'square' ? 1 : 0.86)) {
        const grown = Math.min(top.area * 1.07, START_AREA * (runShape === 'square' ? 1 : 0.86));
        placed = runShape === 'square' ? growRect(top.mp, Math.sqrt(grown / top.area)) : regular(runShape, grown, top.cx, top.cz);
      }
      if (mode === 'time') { timeLeft += TIME_BONUS; showPopup((combo > 1 ? 'Perfect ×' + combo : 'Perfect') + ' · +' + TIME_BONUS + 's'); }
      else showPopup(combo > 1 ? 'Perfect ×' + combo : 'Perfect');
      addRing(placed, y);
      tone(440 * Math.pow(2, (Math.min(combo - 1, 12) * 2) / 12), 0.22, 'sine', 0.18);
      buzz(10);
    } else {
      combo = 0;
      const overlap = clip('intersection', top.mp, dropped);
      if (!overlap.length || area(overlap) < 0.03) {
        addDebris(dropped, y, color, m.axis, sign);
        return gameOver('miss');
      }
      if (runShape === 'square') placed = overlap;
      else {
        // Keep the shape: the biggest copy that fits inside the overlap.
        const [ox, oz] = centroid(overlap);
        const fit = fitShape(runShape, top.area, overlap, [[ox, oz], [top.cx + dx / 2, top.cz + dz / 2]]);
        if (!fit || fit.area < 0.05) {
          addDebris(dropped, y, color, m.axis, sign);
          return gameOver('miss');
        }
        placed = fit.mp;
      }
      addDebris(clip('difference', dropped, placed), y, color, m.axis, sign);
      tone(196 + score * 3, 0.09, 'triangle', 0.16);
      buzz(18);
    }

    stack.push(addLayer(placed, lvl));
    score = stack.length - 1;
    scoreEl.textContent = score;
    scoreEl.classList.add('bump');
    setTimeout(() => scoreEl.classList.remove('bump'), 120);
    setBg(lvl);
    checkDailyGoal();
    checkUnlock();
    spawnMoving();
  }

  // Grows a rectangle about its centre (square mode grow-back).
  function growRect(mp, s) {
    const [cx, cz] = centroid(mp);
    const lim = START / 2;
    return mapPts(mp, (x, z) => [Math.max(cx - lim * 2, cx + (x - cx) * s), Math.max(cz - lim * 2, cz + (z - cz) * s)]);
  }

  function addRing(mp, y) {
    const [cx, cz] = centroid(mp);
    const mesh = new THREE.Mesh(footprintGeo(mp, cx, cz), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
    mesh.userData.ownGeo = true;
    mesh.position.set(cx, y + H / 2 + 0.02, cz);
    mesh.scale.set(1.06, 0.03, 1.06);
    world.add(mesh);
    rings.push({ mesh, t: 0 });
  }

  let popupTimer;
  function showPopup(text, ms) {
    popupEl.textContent = text;
    popupEl.classList.add('show');
    clearTimeout(popupTimer);
    popupTimer = setTimeout(() => popupEl.classList.remove('show'), ms || 700);
  }

  // ---------- HUD line under the score ----------
  function updateSub() {
    const sub = $('sub');
    sub.className = '';
    if (mode === 'time') {
      sub.classList.add('timer');
      if (timeLeft <= 10) sub.classList.add('warn');
      const t = Math.max(0, Math.ceil(timeLeft));
      sub.textContent = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
    } else if (mode === 'daily') {
      const g = dcfg.goal, ds = dailyState();
      const have = g.type === 'floors' ? score : g.type === 'perfects' ? perfects : bestChain;
      sub.textContent = ds.done ? 'Daily goal complete' : 'Goal ' + Math.min(have, g.n) + ' / ' + g.n;
    } else {
      const next = SHAPES[SHAPES.indexOf(runShape) + 1];
      sub.textContent = next && !isUnlocked(next) ? SHAPE_NAMES[next] + ' unlocks at ' + UNLOCK_SCORE : '';
    }
    sub.hidden = state !== 'playing' || !sub.textContent;
  }

  // ---------- unlocks ----------
  function checkUnlock() {
    if (mode !== 'endless' || score !== UNLOCK_SCORE) return;
    const next = SHAPES[SHAPES.indexOf(runShape) + 1];
    if (next && !unlockedSet().includes(next) && !isUnlockedByScoreSoFar(next)) {
      unlock(next); newlyUnlocked = next;
      showPopup(SHAPE_NAMES[next] + ' unlocked!', 1600);
      tone(660, 0.3, 'sine', 0.18);
    }
  }
  // isUnlocked() reads the saved best, which only updates at game over; this avoids a double announcement.
  function isUnlockedByScoreSoFar(s) { return unlockedSet().includes(s); }

  // ---------- daily goal + streak ----------
  function checkDailyGoal() {
    if (mode !== 'daily') return;
    const ds = dailyState(), g = dcfg.goal;
    const have = g.type === 'floors' ? score : g.type === 'perfects' ? perfects : bestChain;
    if (!ds.done && have >= g.n) {
      ds.done = true; dailyJustDone = true;
      store.set('ss_daily', ds);
      const s = store.get('ss_streak', { count: 0, last: '' });
      if (s.last !== dayKey()) {
        s.count = s.last === dayKey(-1) ? s.count + 1 : 1;
        s.last = dayKey();
        store.set('ss_streak', s);
      }
      showPopup('Daily goal complete!', 1600);
      tone(784, 0.35, 'sine', 0.2);
      buzz([20, 40, 20]);
    }
  }

  // ---------- menu ----------
  function glyphPath(kind) {
    const ring = regular(kind, kind === 'square' ? 1.28 : 1.6, 0, 0)[0][0];
    return 'M' + ring.map(([x, z]) => x.toFixed(3) + ' ' + z.toFixed(3)).join('L') + 'Z';
  }
  const LOCK_SVG = '<svg class="lock" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 5.5V4a2.5 2.5 0 0 1 5 0v1.5"/><rect x="2" y="5.5" width="8" height="5.5" rx="1.2"/></svg>';
  const shapesEl = $('shapes');
  shapesEl.innerHTML = SHAPES.map((s) =>
    '<button type="button" class="shape" role="radio" data-shape="' + s + '" aria-label="' + SHAPE_NAMES[s] + '">' +
    '<svg viewBox="-1 -1 2 2" aria-hidden="true"><path class="glyph" d="' + glyphPath(s) + '"/></svg>' +
    '<span>' + SHAPE_NAMES[s] + '</span>' + LOCK_SVG + '</button>').join('');
  const shapeBtns = shapesEl.querySelectorAll('.shape');
  const segBtns = document.querySelectorAll('.seg-btn');

  function renderMenu() {
    segBtns.forEach((b) => b.setAttribute('aria-checked', String(b.dataset.mode === mode)));
    shapeBtns.forEach((b) => {
      const s = b.dataset.shape, un = isUnlocked(s);
      b.classList.toggle('locked', !un);
      b.querySelector('.lock').style.display = un ? 'none' : '';
      b.setAttribute('aria-checked', String(s === shape));
      b.setAttribute('aria-label', SHAPE_NAMES[s] + (un ? '' : ', locked'));
    });
    shapesEl.hidden = mode === 'daily';
    const play = $('playBtn');
    if (mode === 'daily') {
      const cfg = dailyConfig(dayKey()), ds = dailyState(), st = streakNow();
      let t = "Today's shape: " + SHAPE_NAMES[cfg.shape] + '. ' + goalText(cfg) + '.';
      if (ds.done) t += ' Done! Best today ' + ds.best + '.';
      if (st > 0) t += ' Streak ' + st + (st === 1 ? ' day.' : ' days.');
      $('modeInfo').textContent = t;
      play.innerHTML = 'Play daily';
    } else if (!isUnlocked(shape)) {
      const prev = SHAPES[SHAPES.indexOf(shape) - 1];
      $('modeInfo').textContent = SHAPE_NAMES[shape] + ' is locked. Reach ' + UNLOCK_SCORE + ' in ' + SHAPE_NAMES[prev] + ' Endless (best ' + bestOf('endless', prev) + '), or unlock it now.';
      play.innerHTML = 'Unlock ' + SHAPE_NAMES[shape] + '<small>Watch a short ad</small>';
    } else {
      const b = bestOf(mode, shape);
      $('modeInfo').textContent = (mode === 'time' ? '60 seconds. Every perfect drop adds 2 seconds. ' : SHAPE_FEEL[shape] + ' ') + 'Best ' + b + '.';
      play.innerHTML = 'Play';
    }
  }
  segBtns.forEach((b) => b.addEventListener('click', () => { mode = b.dataset.mode; store.set('ss_mode2', mode); renderMenu(); reset(); }));
  shapeBtns.forEach((b) => b.addEventListener('click', () => { shape = b.dataset.shape; store.set('ss_shape', shape); renderMenu(); reset(); }));

  function showMenu() {
    state = 'menu';
    overEl.hidden = true; scoreEl.hidden = true; $('sub').hidden = true;
    menuEl.hidden = false;
    reset();
    renderMenu();
  }

  async function onPlay() {
    if (busy) return;
    if (mode !== 'daily' && !isUnlocked(shape)) {
      busy = true;
      let ok = false;
      try { ok = await window.Ads.showRewarded(); } catch (e) { ok = false; }
      busy = false;
      if (ok) { unlock(shape); showPopup(SHAPE_NAMES[shape] + ' unlocked!', 1400); }
      renderMenu();
      return;
    }
    start();
  }

  function modeLabel() { return mode === 'daily' ? 'Daily · ' + SHAPE_NAMES[runShape] : SHAPE_NAMES[runShape] + ' · ' + MODES[mode]; }

  function gameOver(reason) {
    state = 'over';
    overAt = performance.now();
    if (moving) {
      const top = topLayer(), m = moving;
      addDebris(translate(m.local, top.cx + (m.axis === 'x' ? m.off : 0), top.cz + (m.axis === 'z' ? m.off : 0)), m.lvl * H, colorAt(m.lvl), m.axis, m.dir);
      removeMesh(m.mesh); moving = null;
    }
    tone(110, 0.5, 'sawtooth', 0.12);
    buzz([30, 40, 60]);
    gamesPlayed++;
    let isNew = false, best;
    if (mode === 'daily') {
      const ds = dailyState();
      isNew = score > ds.best;
      if (isNew) { ds.best = score; store.set('ss_daily', ds); }
      best = ds.best;
    } else {
      best = bestOf(mode, runShape);
      isNew = score > best;
      if (isNew) { best = score; store.set(bestKey(mode, runShape), best); }
    }
    const canContinue = mode !== 'daily' && !continued && score >= MIN_SCORE_TO_CONTINUE;
    setTimeout(() => {
      $('overMode').textContent = mode === 'time' && reason === 'time' ? "Time's up · " + SHAPE_NAMES[runShape] : modeLabel();
      $('finalScore').textContent = score;
      $('finalBest').textContent = best;
      $('newBest').hidden = !(isNew && score > 0);
      const og = $('overGoal');
      if (mode === 'daily') {
        const ds = dailyState();
        og.textContent = ds.done ? (dailyJustDone ? 'Daily goal complete · Streak ' + streakNow() : 'Daily goal done · Streak ' + streakNow()) : 'Goal: ' + goalText(dcfg);
        og.hidden = false;
      } else og.hidden = true;
      const un = $('unlockNote');
      un.textContent = newlyUnlocked ? SHAPE_NAMES[newlyUnlocked] + ' unlocked · try it from Change mode' : '';
      un.hidden = !newlyUnlocked;
      $('contScore').textContent = score;
      $('continueBtn').hidden = !canContinue;
      $('continueBtn').firstChild.textContent = mode === 'time' && reason === 'time' ? '+' + TIME_CONTINUE + ' seconds at ' : 'Continue from ';
      scoreEl.hidden = true; $('sub').hidden = true;
      overEl.hidden = false;
    }, 650);
  }

  function start() {
    reset();
    state = 'playing';
    menuEl.hidden = true; overEl.hidden = true; scoreEl.hidden = false;
    spawnMoving();
  }

  async function playAgain() {
    if (busy) return;
    busy = true;
    try { await window.Ads.maybeInterstitial(gamesPlayed); } catch (e) {}
    busy = false;
    start();
  }

  async function continueRun() {
    if (busy) return;
    busy = true;
    let ok = false;
    try { ok = await window.Ads.showRewarded(); } catch (e) { ok = false; }
    busy = false;
    if (!ok) { $('continueBtn').hidden = true; return; }
    continued = true;
    gamesPlayed = Math.max(0, gamesPlayed - 1);
    combo = 0;
    if (mode === 'time' && timeLeft <= 0) timeLeft = TIME_CONTINUE;
    overEl.hidden = true; scoreEl.hidden = false;
    state = 'playing';
    spawnMoving();
  }

  // ---------- audio + haptics ----------
  let ac = null;
  let muted = !!store.get('ts_muted', 0);
  $('mute').textContent = muted ? 'OFF' : 'SND';
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  function tone(freq, dur, type, vol) {
    if (!ac || muted) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // ---------- input ----------
  const scoreEl = $('score'), popupEl = $('popup'), menuEl = $('menu'), overEl = $('over');
  function onTap() {
    initAudio();
    if (state === 'menu') onPlay();
    else if (state === 'playing' && moving) place();
    else if (state === 'over' && performance.now() - overAt > 700 && !overEl.hidden && $('continueBtn').hidden) playAgain();
  }
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('button')) return;
    if (busy || window.Ads.isOpen()) return;
    e.preventDefault();
    onTap();
  });
  window.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('button')) return;
    if (busy || window.Ads.isOpen()) return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onTap(); }
  });
  $('mute').addEventListener('click', () => {
    muted = !muted;
    $('mute').textContent = muted ? 'OFF' : 'SND';
    store.set('ts_muted', muted ? 1 : 0);
  });
  $('playBtn').addEventListener('click', () => { initAudio(); onPlay(); });
  $('againBtn').addEventListener('click', () => { initAudio(); playAgain(); });
  $('continueBtn').addEventListener('click', () => { initAudio(); continueRun(); });
  $('menuBtn').addEventListener('click', () => { if (!busy) showMenu(); });

  const privacyBtns = document.querySelectorAll('.privacy-btn');
  const syncPrivacyBtns = () => privacyBtns.forEach((b) => { b.hidden = !window.Ads.privacyRequired(); });
  document.addEventListener('ads:privacy', syncPrivacyBtns);
  syncPrivacyBtns();
  privacyBtns.forEach((b) => b.addEventListener('click', () => window.Ads.showPrivacyOptions()));

  // ---------- loop ----------
  let last = performance.now(), subTick = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    if (state === 'playing') {
      if (moving) {
        moving.off += moving.dir * speed() * dt;
        if (moving.off > RANGE) { moving.off = RANGE; moving.dir = -1; }
        if (moving.off < -RANGE) { moving.off = -RANGE; moving.dir = 1; }
        const top = topLayer();
        moving.mesh.position.x = top.cx + (moving.axis === 'x' ? moving.off : 0);
        moving.mesh.position.z = top.cz + (moving.axis === 'z' ? moving.off : 0);
      }
      if (mode === 'time') {
        timeLeft -= dt;
        if ((subTick += dt) > 0.1) { subTick = 0; updateSub(); }
        if (timeLeft <= 0) { timeLeft = 0; updateSub(); gameOver('time'); }
      }
    }

    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      d.vy -= 26 * dt;
      d.mesh.position.x += d.vx * dt;
      d.mesh.position.z += d.vz * dt;
      d.mesh.position.y += d.vy * dt;
      d.mesh.rotation.x += d.rx * dt;
      d.mesh.rotation.z += d.rz * dt;
      if (d.mesh.position.y < camY - 40) { removeMesh(d.mesh); debris.splice(i, 1); }
    }

    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.t += dt;
      const k = r.t / 0.45;
      r.mesh.scale.x = r.mesh.scale.z = 1.06 + k * 0.35;
      r.mesh.material.opacity = Math.max(0, 0.9 * (1 - k));
      if (k >= 1) { removeMesh(r.mesh); rings.splice(i, 1); }
    }

    const topY = (stack.length - 1) * H;
    let targetY = topY + 2.5, targetZoom = 1;
    if (state === 'over') {
      const viewH = camera.top - camera.bottom;
      targetZoom = Math.min(1, viewH / (topY + 12));
      targetY = topY / 2 + 1;
    }
    camY += (targetY - camY) * Math.min(1, dt * 4);
    const z = camera.zoom + (targetZoom - camera.zoom) * Math.min(1, dt * 3);
    if (Math.abs(z - camera.zoom) > 1e-4) { camera.zoom = z; camera.updateProjectionMatrix(); }
    camera.position.set(12, camY + 12, 12);
    camera.lookAt(0, camY, 0);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // hook used only to render store screenshots and run automated play tests (open with #shots)
  if (location.hash === '#shots') {
    window.__ts = {
      start(m, s) { if (m) mode = m; if (s) shape = s; start(); },
      place() { if (moving) place(); },
      setOff(v) { if (moving) moving.off = v; },
      unlockAll() { SHAPES.forEach(unlock); renderMenu(); },
      menu(m, s) { if (m) mode = m; if (s) shape = s; showMenu(); },
      get moving() { return moving; },
      get state() { return state; },
      get score() { return score; },
      get topArea() { return topLayer().area; },
      timeLeft(v) { timeLeft = v; }
    };
  }

  reset();
  renderMenu();
  requestAnimationFrame(frame);
})();
</script>
