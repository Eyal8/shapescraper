<title>Shapescraper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D canvas, HUD floats over it; one look, hue shifts as the tower grows */
:root {
  --h: 200;
  --ink: #ffffff;
  --ink-soft: rgba(255,255,255,0.82);
  --shadow: rgba(20, 24, 40, 0.22);
  --chip: rgba(255,255,255,0.22);
  --chip-line: rgba(255,255,255,0.45);
  --bg-fallback: #9cc7dd;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; overflow: hidden; }
body {
  background-color: var(--bg-fallback);
  background: linear-gradient(180deg, hsl(var(--h) 60% 86%), hsl(calc(var(--h) + 35) 48% 64%));
  color: var(--ink);
  transition: background 0.8s;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  font-family: var(--mono);
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: fixed; inset: 0; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 28px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center;
  text-shadow: 0 2px 12px var(--shadow);
}
#score {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(56px, 18vw, 96px); line-height: 1;
  font-variant-numeric: tabular-nums;
  transition: transform 0.15s;
}
#score.bump { transform: scale(1.12); }
#popup {
  margin-top: 10px; font-family: var(--display); font-weight: 500;
  font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.2s, transform 0.2s;
}
#popup.show { opacity: 1; transform: none; }
.panel {
  margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 14px;
  text-align: center;
}
.panel h1 {
  margin: 0; font-family: var(--display); font-weight: 800;
  font-size: clamp(34px, 11vw, 64px); line-height: 0.95; letter-spacing: -0.01em;
  text-wrap: balance;
}
.label { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.big { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 36px; }
.stats > div { display: flex; flex-direction: column; gap: 6px; }
.cta {
  margin-top: 8px; padding: 12px 22px; border-radius: 999px;
  background: var(--chip); border: 1px solid var(--chip-line);
  font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: 0.55; } }
#mute {
  position: fixed; pointer-events: auto;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--chip); border: 1px solid var(--chip-line); color: var(--ink);
  font: 500 11px var(--mono); letter-spacing: 0.06em; cursor: pointer;
}
#mute:focus-visible, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
body { margin: 0; }
[hidden] { display: none !important; }
.actions { display: flex; flex-direction: column; gap: 10px; width: min(300px, 100%); margin-top: 6px; }
.btn {
  pointer-events: auto; cursor: pointer;
  padding: 15px 20px; border-radius: 999px;
  background: var(--chip); border: 1px solid var(--chip-line); color: var(--ink);
  font: 500 13px var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
  text-shadow: none;
}
.btn.primary { background: var(--ink); color: #22283a; border-color: var(--ink); font-weight: 500; }
.btn.primary small { display: block; margin-top: 4px; font-size: 10px; letter-spacing: 0.1em; opacity: 0.6; }
#adSim {
  position: fixed; inset: 0; z-index: 20; background: #101320; color: #fff;
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#adSim .adbox { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 320px; }
#adSim p { margin: 0; color: rgba(255,255,255,0.7); font-size: 13px; line-height: 1.5; }
#adClose { pointer-events: auto; }
#adClose:disabled { opacity: 0.4; }
@media (prefers-reduced-motion: reduce) { .cta { animation: none; } body { transition: none; } }
</style>

<canvas id="c" aria-label="Shapescraper game"></canvas>
<div class="hud">
  <div id="score" hidden>0</div>
  <div id="popup">Perfect</div>

  <div class="panel" id="menu">
    <h1>Shape<br>scraper</h1>
    <div class="label">Stack &amp; Slice</div>
    <div class="label">Best <span id="menuBest">0</span></div>
    <div class="cta">Tap to start</div>
    <div class="label">Tap to drop · line it up for perfects</div>
  </div>

  <div class="panel" id="over" hidden>
    <div class="stats">
      <div><span class="label">Score</span><span class="big" id="finalScore">0</span></div>
      <div><span class="label">Best</span><span class="big" id="finalBest">0</span></div>
    </div>
    <div class="label" id="newBest" hidden>New best</div>
    <div class="actions">
      <button type="button" class="btn primary" id="continueBtn">Continue from <span id="contScore">0</span><small>Watch a short ad</small></button>
      <button type="button" class="btn" id="againBtn">Play again</button>
    </div>
  </div>
</div>
<button id="mute" type="button" aria-label="Toggle sound">SND</button>
<div id="adSim" hidden role="dialog" aria-label="Test ad">
  <div class="adbox">
    <span class="label">Test ad</span>
    <div class="big" id="adCount">5</div>
    <p>In the app, a real AdMob video plays here. This placeholder lets you feel the flow in the browser.</p>
    <button type="button" class="btn" id="adClose" disabled>Close ad</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Ads: AdMob inside the app, a simulated ad in the browser ----------
window.Ads = (function () {
  const CONFIG = {
    // Shapescraper's AdMob ad units. While testing is true, Google's test ads are shown instead.
    android: { interstitial: 'ca-app-pub-5535097818156227/3884362464', rewarded: 'ca-app-pub-5535097818156227/8293460890' },
    ios: { interstitial: 'ca-app-pub-5535097818156227/4814300757', rewarded: 'ca-app-pub-5535097818156227/5751058031' },
    testing: true,
    interstitialEveryGames: 3,
    minSecondsBetweenInterstitials: 60
  };
  const cap = window.Capacitor;
  const platform = cap && cap.getPlatform ? cap.getPlatform() : 'web';
  const native = platform === 'android' || platform === 'ios';
  const AdMob = native && window.capacitorExports ? window.capacitorExports.registerPlugin('AdMob') : null;
  const ids = CONFIG[platform] || {};
  const ready = { interstitial: false, rewarded: false };
  let lastInterstitial = Date.now(); // never right at launch

  async function init() {
    if (!AdMob) return;
    try {
      await AdMob.initialize({ initializeForTesting: CONFIG.testing });
      try {
        const info = await AdMob.requestConsentInfo();
        if (info.isConsentFormAvailable && info.status === 'REQUIRED') await AdMob.showConsentForm();
      } catch (e) {}
      if (platform === 'ios') {
        try {
          const t = await AdMob.trackingAuthorizationStatus();
          if (t.status === 'notDetermined') await AdMob.requestTrackingAuthorization();
        } catch (e) {}
      }
      preload('interstitial');
      preload('rewarded');
    } catch (e) { console.warn('AdMob init failed', e); }
  }

  async function preload(kind) {
    if (!AdMob || ready[kind]) return;
    try {
      const opts = { adId: ids[kind], isTesting: CONFIG.testing };
      if (kind === 'rewarded') await AdMob.prepareRewardVideoAd(opts);
      else await AdMob.prepareInterstitial(opts);
      ready[kind] = true;
    } catch (e) {
      ready[kind] = false;
      setTimeout(() => preload(kind), 30000);
    }
  }

  // Waits for one of the given plugin events (or a timeout), then cleans up listeners.
  function waitFor(events, onEvent, timeoutMs) {
    return new Promise((resolve) => {
      const subs = [];
      let finished = false;
      const finish = (name) => {
        if (finished) return;
        finished = true;
        subs.forEach((p) => Promise.resolve(p).then((s) => s && s.remove && s.remove()).catch(() => {}));
        setTimeout(() => resolve(name), 250);
      };
      Object.keys(events).forEach((name) => {
        subs.push(AdMob.addListener(name, (data) => {
          if (onEvent) onEvent(name, data);
          if (events[name]) finish(name);
        }));
      });
      setTimeout(() => finish('timeout'), timeoutMs);
    });
  }

  function simulate(seconds) {
    return new Promise((resolve) => {
      const box = document.getElementById('adSim');
      const count = document.getElementById('adCount');
      const close = document.getElementById('adClose');
      let left = seconds;
      count.textContent = left;
      close.disabled = true;
      box.hidden = false;
      const t = setInterval(() => {
        left--;
        count.textContent = Math.max(left, 0);
        if (left <= 0) { clearInterval(t); close.disabled = false; close.focus(); }
      }, 1000);
      close.onclick = () => { box.hidden = true; resolve(true); };
    });
  }

  async function showRewarded() {
    if (!AdMob) return simulate(5);
    if (!ready.rewarded) { await preload('rewarded'); if (!ready.rewarded) return false; }
    ready.rewarded = false;
    let earned = false;
    const done = waitFor(
      { onRewardedVideoAdReward: false, onRewardedVideoAdDismissed: true, onRewardedVideoAdFailedToShow: true },
      (name) => { if (name === 'onRewardedVideoAdReward') earned = true; },
      180000
    );
    AdMob.showRewardVideoAd().then((r) => { if (r && r.amount) earned = true; }).catch(() => {});
    await done;
    preload('rewarded');
    return earned;
  }

  async function maybeInterstitial(gamesPlayed) {
    const due = gamesPlayed > 0 && gamesPlayed % CONFIG.interstitialEveryGames === 0;
    const spaced = Date.now() - lastInterstitial > CONFIG.minSecondsBetweenInterstitials * 1000;
    if (!due || !spaced) return;
    lastInterstitial = Date.now();
    if (!AdMob) { await simulate(3); return; }
    if (!ready.interstitial) { preload('interstitial'); return; }
    ready.interstitial = false;
    const done = waitFor({ interstitialAdDismissed: true, interstitialAdFailedToShow: true }, null, 120000);
    AdMob.showInterstitial().catch(() => {});
    await done;
    preload('interstitial');
  }

  init();
  return { showRewarded, maybeInterstitial, isOpen: () => !document.getElementById('adSim').hidden };
})();
</script>
<script>
(function () {
  const H = 1;          // block height
  const START = 3.2;    // starting block size
  const RANGE = 7;      // how far moving blocks travel
  const PERFECT = 0.14; // snap tolerance

  const $ = (id) => document.getElementById(id);
  const scoreEl = $('score'), popupEl = $('popup'), menuEl = $('menu'), overEl = $('over');

  let best = 0;
  try { best = parseInt(localStorage.getItem('ts_best') || '0', 10) || 0; } catch (e) {}
  let muted = false;
  try { muted = localStorage.getItem('ts_muted') === '1'; } catch (e) {}
  $('menuBest').textContent = best;
  $('mute').textContent = muted ? 'OFF' : 'SND';

  // ---------- three.js setup ----------
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(5, 14, 3); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.22); fill.position.set(-8, 3, -2); scene.add(fill);
  const world = new THREE.Group(); scene.add(world);
  const geo = new THREE.BoxGeometry(1, 1, 1);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    const a = w / h;
    const vh = Math.max(14, 11 / a);
    const vw = vh * a;
    camera.left = -vw / 2; camera.right = vw / 2;
    camera.top = vh / 2; camera.bottom = -vh / 2;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- game state ----------
  let state = 'menu';
  let stack = [], debris = [], rings = [], moving = null;
  let score = 0, combo = 0, hueBase = 0, camY = 2, overAt = 0;
  let gamesPlayed = 0, continued = false, busy = false;
  const MIN_SCORE_TO_CONTINUE = 5;

  const hueAt = (lvl) => (hueBase + lvl * 6) % 360;
  function colorAt(lvl) { return new THREE.Color().setHSL(hueAt(lvl) / 360, 0.62, 0.62); }

  function makeMesh(w, d, x, y, z, color, h) {
    const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color }));
    m.scale.set(w, h || H, d);
    m.position.set(x, y, z);
    world.add(m);
    return m;
  }
  function removeMesh(m) { world.remove(m); m.material.dispose(); }

  function setBg(lvl) { document.documentElement.style.setProperty('--h', Math.round(hueAt(lvl + 8))); }

  function reset() {
    while (world.children.length) removeMesh(world.children[0]);
    stack = []; debris = []; rings = []; moving = null;
    score = 0; combo = 0;
    hueBase = Math.random() * 360;
    // pedestal
    makeMesh(START, START, 0, -H / 2 - 15, 0, colorAt(0).offsetHSL(0, -0.1, -0.12), 30);
    const base = { x: 0, z: 0, w: START, d: START };
    base.mesh = makeMesh(START, START, 0, 0, 0, colorAt(0));
    stack.push(base);
    setBg(0);
    scoreEl.textContent = '0';
  }

  function spawnMoving() {
    const top = stack[stack.length - 1];
    const lvl = stack.length;
    const axis = lvl % 2 ? 'x' : 'z';
    moving = { axis, x: top.x, z: top.z, w: top.w, d: top.d, dir: 1 };
    moving[axis] = -RANGE;
    moving.mesh = makeMesh(top.w, top.d, moving.x, lvl * H, moving.z, colorAt(lvl));
  }

  const speed = () => Math.min(4 + score * 0.14, 11.5);

  function addDebris(w, d, x, y, z, color, vx, vz) {
    const mesh = makeMesh(w, d, x, y, z, color);
    debris.push({ mesh, vy: 0, vx, vz, rx: (Math.random() - 0.5) * 3, rz: (Math.random() - 0.5) * 3 });
  }

  function place() {
    const top = stack[stack.length - 1];
    const m = moving, axis = m.axis;
    const sizeKey = axis === 'x' ? 'w' : 'd';
    const lvl = stack.length, y = lvl * H;
    const delta = m[axis] - top[axis];
    const overlap = top[sizeKey] - Math.abs(delta);
    const color = colorAt(lvl);

    if (overlap <= 0) {
      // missed completely
      removeMesh(m.mesh);
      addDebris(m.w, m.d, m.x, y, m.z, color, axis === 'x' ? Math.sign(delta) * 2 : 0, axis === 'z' ? Math.sign(delta) * 2 : 0);
      moving = null;
      return gameOver();
    }

    const placed = { x: m.x, z: m.z, w: m.w, d: m.d };
    if (Math.abs(delta) < PERFECT) {
      combo++;
      placed[axis] = top[axis];
      if (combo >= 3) {
        // reward streaks by growing the block back toward full size
        placed.w = Math.min(START, placed.w + 0.12);
        placed.d = Math.min(START, placed.d + 0.12);
      }
      addRing(placed, y);
      showPopup(combo > 1 ? 'Perfect ×' + combo : 'Perfect');
      tone(440 * Math.pow(2, Math.min(combo - 1, 12) * 2 / 12), 0.22, 'sine', 0.18);
      buzz(10);
    } else {
      combo = 0;
      const sign = Math.sign(delta);
      placed[sizeKey] = overlap;
      placed[axis] = top[axis] + delta / 2;
      const cutSize = Math.abs(delta);
      const cutCenter = placed[axis] + sign * (overlap / 2 + cutSize / 2);
      const cw = axis === 'x' ? cutSize : m.w;
      const cd = axis === 'z' ? cutSize : m.d;
      const cx = axis === 'x' ? cutCenter : m.x;
      const cz = axis === 'z' ? cutCenter : m.z;
      addDebris(cw, cd, cx, y, cz, color, axis === 'x' ? sign * 1.5 : 0, axis === 'z' ? sign * 1.5 : 0);
      tone(196 + score * 3, 0.09, 'triangle', 0.16);
      buzz(18);
    }

    removeMesh(m.mesh);
    placed.mesh = makeMesh(placed.w, placed.d, placed.x, y, placed.z, color);
    stack.push(placed);
    score = stack.length - 1;
    scoreEl.textContent = score;
    scoreEl.classList.add('bump');
    setTimeout(() => scoreEl.classList.remove('bump'), 120);
    setBg(lvl);
    spawnMoving();
  }

  function addRing(p, y) {
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(p.x, y + H / 2 + 0.01, p.z);
    mesh.scale.set(p.w + 0.2, 0.03, p.d + 0.2);
    world.add(mesh);
    rings.push({ mesh, t: 0, w: p.w + 0.2, d: p.d + 0.2 });
  }

  let popupTimer;
  function showPopup(text) {
    popupEl.textContent = text;
    popupEl.classList.add('show');
    clearTimeout(popupTimer);
    popupTimer = setTimeout(() => popupEl.classList.remove('show'), 700);
  }

  function gameOver() {
    state = 'over';
    overAt = performance.now();
    tone(110, 0.5, 'sawtooth', 0.12);
    buzz([30, 40, 60]);
    gamesPlayed++;
    const isNew = score > best;
    if (isNew) { best = score; try { localStorage.setItem('ts_best', String(best)); } catch (e) {} }
    const canContinue = !continued && score >= MIN_SCORE_TO_CONTINUE;
    setTimeout(() => {
      $('finalScore').textContent = score;
      $('finalBest').textContent = best;
      $('newBest').hidden = !(isNew && score > 0);
      $('contScore').textContent = score;
      const cb = $('continueBtn');
      cb.hidden = !canContinue;
      scoreEl.hidden = true;
      overEl.hidden = false;
    }, 650);
  }

  function start() {
    reset();
    continued = false;
    state = 'playing';
    menuEl.hidden = true; overEl.hidden = true; scoreEl.hidden = false;
    spawnMoving();
  }

  async function playAgain() {
    if (busy) return;
    busy = true;
    try { await window.Ads.maybeInterstitial(gamesPlayed); } catch (e) {}
    busy = false;
    start();
  }

  async function continueRun() {
    if (busy) return;
    busy = true;
    let ok = false;
    try { ok = await window.Ads.showRewarded(); } catch (e) { ok = false; }
    busy = false;
    const cb = $('continueBtn');
    if (!ok) { cb.hidden = true; return; } // no ad / skipped: only "Play again" remains
    // second chance: same tower, fresh block on top
    continued = true;
    gamesPlayed = Math.max(0, gamesPlayed - 1);
    combo = 0;
    overEl.hidden = true; scoreEl.hidden = false;
    state = 'playing';
    spawnMoving();
  }

  $('againBtn').addEventListener('click', () => { initAudio(); playAgain(); });
  $('continueBtn').addEventListener('click', () => { initAudio(); continueRun(); });

  // ---------- audio + haptics ----------
  let ac = null;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  function tone(freq, dur, type, vol) {
    if (!ac || muted) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // ---------- input ----------
  function onTap() {
    initAudio();
    if (state === 'menu') start();
    else if (state === 'playing' && moving) place();
    else if (state === 'over' && performance.now() - overAt > 700 && !overEl.hidden && $('continueBtn').hidden) playAgain();
  }
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('button')) return;
    if (busy || window.Ads.isOpen()) return;
    e.preventDefault();
    onTap();
  });
  window.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('button')) return;
    if (busy || window.Ads.isOpen()) return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onTap(); }
  });
  $('mute').addEventListener('click', () => {
    muted = !muted;
    $('mute').textContent = muted ? 'OFF' : 'SND';
    try { localStorage.setItem('ts_muted', muted ? '1' : '0'); } catch (e) {}
  });

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    if (moving && state === 'playing') {
      const a = moving.axis;
      moving[a] += moving.dir * speed() * dt;
      if (moving[a] > RANGE) { moving[a] = RANGE; moving.dir = -1; }
      if (moving[a] < -RANGE) { moving[a] = -RANGE; moving.dir = 1; }
      moving.mesh.position.x = moving.x;
      moving.mesh.position.z = moving.z;
    }

    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      d.vy -= 26 * dt;
      d.mesh.position.x += d.vx * dt;
      d.mesh.position.z += d.vz * dt;
      d.mesh.position.y += d.vy * dt;
      d.mesh.rotation.x += d.rx * dt;
      d.mesh.rotation.z += d.rz * dt;
      if (d.mesh.position.y < camY - 40) { removeMesh(d.mesh); debris.splice(i, 1); }
    }

    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.t += dt;
      const k = r.t / 0.45;
      r.mesh.scale.x = r.w * (1 + k * 0.35);
      r.mesh.scale.z = r.d * (1 + k * 0.35);
      r.mesh.material.opacity = Math.max(0, 0.9 * (1 - k));
      if (k >= 1) { removeMesh(r.mesh); rings.splice(i, 1); }
    }

    const topY = (stack.length - 1) * H;
    let targetY = topY + 2.5, targetZoom = 1;
    if (state === 'over') {
      const viewH = camera.top - camera.bottom;
      targetZoom = Math.min(1, viewH / (topY + 12));
      targetY = topY / 2 + 1;
    }
    const ease = Math.min(1, dt * 4);
    camY += (targetY - camY) * ease;
    const z = camera.zoom + (targetZoom - camera.zoom) * Math.min(1, dt * 3);
    if (Math.abs(z - camera.zoom) > 1e-4) { camera.zoom = z; camera.updateProjectionMatrix(); }
    camera.position.set(12, camY + 12, 12);
    camera.lookAt(0, camY, 0);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // hook used only to render store screenshots (open with #shots)
  if (location.hash === '#shots') {
    window.__ts = { start, place, get moving() { return moving; }, get top() { return stack[stack.length - 1]; } };
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
