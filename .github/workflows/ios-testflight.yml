name: iOS production archive only
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Candidate build number; not reserved until a later approved upload'
        required: true
        type: string
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Match the stable local toolchain used for the passed age/update reference.
          xcode-version: '27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate build number
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: '[[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]'
      - run: npm ci
      - name: Prepare production assets
        env:
          ADS_TEST: 'false'
          ANALYTICS_TEST: 'false'
          UMP_TEST: 'false'
        run: npm run build && npx cap sync ios
      - name: Archive Release without credentials or store upload
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -o pipefail
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" OTHER_SWIFT_FLAGS="" \
            | tee "$RUNNER_TEMP/archive.log"
      - name: Package local-signing candidate
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/production-unsigned.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: shapescraper-production-unsigned-archive
          path: |
            ${{ runner.temp }}/production-unsigned.xcarchive.zip
            ${{ runner.temp }}/archive.log
