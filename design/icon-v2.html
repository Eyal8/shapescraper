<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#stars{position:fixed;inset:0}
</style></head>
<body>
<div id="stars"></div>
<canvas id="c"></canvas>
<script src="../node_modules/three/build/three.min.js"></script>
<script>
// Icon v2. ?bg=1..6  ?layout=I|H  ?shape3=star|hexagon|triangle
const q = new URLSearchParams(location.search);
const bg = q.get('bg') || '1', layout = q.get('layout') || 'H', third = q.get('shape3') || 'star';
const BGS = {
  1: 'linear-gradient(180deg, hsl(250 45% 30%), hsl(300 45% 22%))',                         // night purple
  2: 'radial-gradient(circle at 55% 45%, hsl(255 55% 42%) 0%, hsl(245 55% 20%) 55%, hsl(240 60% 12%) 100%)', // navy with a glow
  3: 'linear-gradient(180deg, hsl(255 50% 22%) 0%, hsl(305 55% 30%) 55%, hsl(20 80% 45%) 100%)',  // dusk
  4: 'linear-gradient(180deg, hsl(200 60% 22%), hsl(230 55% 14%))',                         // midnight blue-teal
  5: 'linear-gradient(180deg, hsl(245 50% 18%), hsl(275 50% 14%))',                         // night sky (+ dots)
  6: 'linear-gradient(180deg, hsl(28 90% 86%), hsl(350 70% 74%))'                           // light, the game's menu palette
};
// Streetwear palette mode: ?rose=1..8 overrides background and tower colors.
const PINK = '#ff206e', LEMON = '#fbff12', TURQ = '#41ead4', BLK = '#121212', WHT = '#ffffff';
const ROSE = {
  1: { bg: `linear-gradient(180deg, #232323, ${BLK})`, star: [LEMON, '#fffbb0'], heart: ['#b3134c', PINK], circle: ['#1fae9c', TURQ] },
  2: { bg: `linear-gradient(160deg, ${PINK}, #8a0f3c)`, star: [LEMON, WHT], heart: [WHT, '#ffd1e1'], circle: ['#1fae9c', TURQ] },
  3: { bg: `linear-gradient(180deg, ${LEMON}, #f0f05a)`, star: [BLK, '#3a3a3a'], heart: ['#c4124f', PINK], circle: ['#139684', TURQ] },
  4: { bg: `linear-gradient(180deg, ${TURQ}, #128f80)`, star: [LEMON, WHT], heart: ['#c4124f', PINK], circle: [BLK, '#3a3a3a'] },
  5: { bg: `linear-gradient(180deg, ${PINK} 0%, #ff7a3d 55%, ${LEMON} 100%)`, star: [WHT, '#fffde0'], heart: ['#6a0a2b', '#b3134c'], circle: ['#139684', TURQ] },
  6: { bg: `linear-gradient(180deg, ${TURQ} 0%, #8f7bd8 50%, ${PINK} 100%)`, star: [LEMON, WHT], heart: [WHT, '#ffe0ec'], circle: [BLK, '#333'] },
  7: { bg: `radial-gradient(circle at 55% 40%, #3b0f24 0%, ${BLK} 70%)`, star: [LEMON, WHT], heart: ['#b3134c', PINK], circle: ['#1fae9c', TURQ] },
  8: { bg: `linear-gradient(180deg, ${BLK} 0%, #2a0a18 60%, ${PINK} 130%)`, star: [TURQ, '#bff8f0'], heart: [LEMON, '#fffbb0'], circle: [PINK, '#ff8fb5'] },
  // Klein blue palette
  9:  { bg: 'linear-gradient(180deg, #4100f5, #22007f)', star: ['#cdf564', '#e8ffa0'], heart: ['#c0247f', '#f037a5'], circle: ['#e0331f', '#ff4632'] },
  10: { bg: 'linear-gradient(180deg, #2a2222, #191414)', star: ['#cdf564', '#e8ffa0'], heart: ['#c0247f', '#f037a5'], circle: ['#3a00d0', '#5a2bff'] },
  11: { bg: 'linear-gradient(180deg, #9bf0e1 0%, #f5f064 30%, #ff4632 58%, #191414 80%, #4100f5 100%)', star: ['#ffffff', '#eef'], heart: ['#c0247f', '#f037a5'], circle: ['#3a00d0', '#5a2bff'] },
  12: { bg: 'linear-gradient(180deg, #cdf564, #a9d43a)', star: ['#3a00d0', '#5a2bff'], heart: ['#c0247f', '#f037a5'], circle: ['#e0331f', '#ff4632'] },
  // XITE colour pairs
  13: { bg: 'linear-gradient(180deg, #8800ee, #5500a0)', star: ['#a8c400', '#d6f000'], heart: ['#ff77dd', '#ffb0ee'], circle: ['#00c45a', '#00ee66'] },
  14: { bg: 'linear-gradient(180deg, #00330f, #001a08)', star: ['#00c45a', '#00ee66'], heart: ['#f080e8', '#f9a0f0'], circle: ['#e8e800', '#ffff00'] },
  15: { bg: 'linear-gradient(180deg, #990066, #5c003d)', star: ['#e8e800', '#ffff00'], heart: ['#ff77dd', '#ffc0f0'], circle: ['#00a0e8', '#00b4ff'] },
  16: { bg: 'linear-gradient(180deg, #77ddff, #3fb6e6)', star: ['#e8e800', '#ffff00'], heart: ['#ff55cc', '#ff77dd'], circle: ['#5500a0', '#7a20d0'] },
  // holographic gradients
  17: { bg: 'linear-gradient(180deg, #1f1c33, #0a0912)', star: ['#ffe98a', '#9dffc8'], heart: ['#b9a4ff', '#ff9fd6'], circle: ['#8af3ff', '#b9a4ff'] },
  18: { bg: 'linear-gradient(180deg, #f4f2ff, #d6e2ff)', star: ['#ffd36b', '#7dffc0'], heart: ['#9b82ff', '#ff86c8'], circle: ['#5ee8ff', '#9b82ff'] },
  19: { bg: 'linear-gradient(160deg, #22e4ff 0%, #7a5cff 35%, #ff2fa8 70%, #ffb547 100%)', star: ['#ffffff', '#fff6d0'], heart: ['#ffffff', '#ffe0f2'], circle: ['#ffffff', '#dff9ff'] },
  // colour-block grid pairs
  20: { bg: 'linear-gradient(180deg, #0033b3, #001f70)', star: ['#ffd100', '#ffe566'], heart: ['#ff7ae6', '#ffaef0'], circle: ['#f97328', '#ff9a5c'] },
  21: { bg: 'linear-gradient(180deg, #ffee00, #e6d600)', star: ['#0d0d0d', '#2a2a2a'], heart: ['#ff0090', '#ff4fb0'], circle: ['#0077bb', '#1f99e0'] },
  22: { bg: 'linear-gradient(180deg, #101440, #070920)', star: ['#ffffff', '#f0f0f0'], heart: ['#ff96b8', '#ffc0d4'], circle: ['#7ae8fa', '#b0f3ff'] },
  23: { bg: 'linear-gradient(180deg, #08e592, #05b373)', star: ['#ffee00', '#fff566'], heart: ['#aa00ff', '#c64dff'], circle: ['#1e0a3c', '#3a1a6a'] },
  // used by glitch modes 2 and 4: one print colour per tower
  cmy: { bg: '#000', star: ['#ffe600', '#fff27a'], heart: ['#ff2fa8', '#ff6fc2'], circle: ['#22e4ff', '#7af0ff'] }
};
const glitch = q.get('glitch');
const rose = ROSE[q.get('rose')] || (q.get('glitch') === '2' ? ROSE.cmy : null);
document.body.style.background = rose ? rose.bg : BGS[bg];
if (bg === '5') {
  // a few soft "stars" in the sky, fixed positions so every render is identical
  const pts = [[12,10,3],[28,22,2],[44,7,2.5],[70,12,3],[86,26,2],[18,38,2],[90,6,2.5],[60,30,1.8],[8,58,2],[93,48,2.2],[35,14,1.6],[78,40,1.6]];
  document.getElementById('stars').innerHTML = pts.map(([x, y, r]) => `<i style="position:absolute;left:${x}%;top:${y}%;width:${r*4}px;height:${r*4}px;border-radius:50%;background:#fff;opacity:.55;box-shadow:0 0 ${r*6}px #fff"></i>`).join('');
}

const canvas = document.getElementById('c');
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H, false);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.58));
const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(5, 14, 3); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.28); fill.position.set(-8, 3, -2); scene.add(fill);

function poly(n, rot = -Math.PI / 2, rad = 1) {
  const s = new THREE.Shape();
  for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; const p = [Math.cos(a) * rad, Math.sin(a) * rad]; i ? s.lineTo(...p) : s.moveTo(...p); }
  s.closePath(); return s;
}
const SHAPES = {
  circle: () => { const s = new THREE.Shape(); s.absarc(0, 0, 1, 0, Math.PI * 2, false); return s; },
  triangle: () => poly(3, -Math.PI / 2, 1.3),
  hexagon: () => poly(6, 0, 1.1),
  star: () => {
    const s = new THREE.Shape();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5; const rr = i % 2 ? 0.56 : 1.3; const p = [Math.cos(a) * rr, Math.sin(a) * rr]; i ? s.lineTo(...p) : s.moveTo(...p); }
    s.closePath(); return s;
  },
  heart: () => {
    const s = new THREE.Shape();
    s.moveTo(0, -1.05);
    s.bezierCurveTo(-0.6, -0.55, -1.25, -0.15, -1.15, 0.4);
    s.bezierCurveTo(-1.05, 0.95, -0.35, 1.15, 0, 0.6);
    s.bezierCurveTo(0.35, 1.15, 1.05, 0.95, 1.15, 0.4);
    s.bezierCurveTo(1.25, -0.15, 0.6, -0.55, 0, -1.05);
    return s;
  }
};
const geoCache = {};
function layerGeo(kind) {
  if (!geoCache[kind]) {
    const g = new THREE.ExtrudeGeometry(SHAPES[kind](), { depth: 1, bevelEnabled: false, curveSegments: 48 });
    g.rotateX(-Math.PI / 2);
    geoCache[kind] = g;
  }
  return geoCache[kind];
}
const mat = (h, s, l) => new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(((h % 360) + 360) % 360 / 360, s, l) });
// A tower like real play: most drops perfect, a few misses where the block shrinks and shifts.
// misses: {layerIndex: [shrink, dx, dz]}; hue ramps from h0 (bottom) to h1 (top).
function tower(kind, x, z, layers, h0, h1, scale, misses = {}, sink = 0) {
  const rc = rose && (rose[kind] || rose.star);
  const hexMat = (t, dl) => new THREE.MeshLambertMaterial({ color: new THREE.Color(rc[0]).lerp(new THREE.Color(rc[1]), t).offsetHSL(0, 0, dl) });
  const g = new THREE.Group();
  const base = new THREE.Mesh(layerGeo(kind), rc ? hexMat(0, -0.08) : mat(h0, 0.65, 0.5));
  base.scale.set(scale, 40, scale); base.position.y = -40; g.add(base);
  let s = scale, ox = 0, oz = 0;
  for (let i = 0; i < layers; i++) {
    if (misses[i]) { const [k, dx, dz] = misses[i]; s *= k; ox += dx; oz += dz; }
    const t = layers > 1 ? i / (layers - 1) : 1;
    const m = new THREE.Mesh(layerGeo(kind), rc ? hexMat(t, i % 2 ? 0.02 : 0) : mat(h0 + (h1 - h0) * t, 0.78, 0.56 + t * 0.08 + (i % 2 ? 0.025 : 0)));
    m.scale.set(s, 1, s); m.position.set(ox, i, oz); g.add(m);
  }
  g.rotation.y = Math.PI / 4;
  g.position.set(x, -sink, z); scene.add(g);
}
const at = (sx, d) => [(sx + d) / 2, (d - sx) / 2];
const thirdTop = { star: [20, 45], hexagon: [20, 45], triangle: [20, 45] }[third];
if (layout === 'I') {
  // heart tall on the right (purple -> pink), circle medium on the left (teal -> green), third shape short in front (orange)
  tower('heart', ...at(3.7, -2.2), 8, 280, 335, 2.35, { 3: [0.9, 0.12, 0], 6: [0.92, 0, -0.1] });
  tower('circle', ...at(-3.9, -1.4), 5, 175, 120, 2.0, { 2: [0.88, 0, 0.12] });
  tower(third, ...at(-0.1, 2.9), 3, thirdTop[0], thirdTop[1], 2.15, { 1: [0.9, -0.1, 0] });
} else {
  // H: third shape tall at the back, heart medium on the left, circle short on the right
  tower(third, ...at(0.4, -3.0), 14, 0, 50, 2.75, { 2: [0.93, 0.2, 0], 5: [0.96, 0, -0.12], 6: [0.9, -0.22, 0], 10: [0.95, 0, 0.15], 12: [0.97, 0.1, 0] }, 6);
  tower('heart', ...at(-4.4, 0.6), 11, 270, 340, 2.6, { 1: [0.92, -0.2, 0], 4: [0.96, 0, 0.14], 5: [0.93, 0.16, 0], 8: [0.95, 0, -0.18] }, 6);
  tower('circle', ...at(4.5, 1.4), 9, 185, 110, 2.3, { 0: [0.95, 0, 0.15], 3: [0.9, 0.2, 0], 4: [0.97, 0, -0.1], 7: [0.94, -0.15, 0] }, 6);
}
const view = 15.2, cy = 3.2;
const cam = new THREE.OrthographicCamera(-view / 2, view / 2, view / 2, -view / 2, 0.1, 300);
cam.position.set(11, cy + 19, 11); cam.lookAt(0, cy, 0);
if (!glitch) r.render(scene, cam);
else {
  // Misregistered print: render the towers several times in flat ink colours, offset, and blend them.
  canvas.style.display = 'none';
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  out.style.cssText = 'position:fixed;inset:0;width:100%;height:100%'; document.body.appendChild(out);
  const ctx = out.getContext('2d'), d = Math.round(W * (glitch === '1' || glitch === '2' ? 0.024 : 0.014));
  const paper = glitch === '3' || glitch === '4';
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  if (paper) { grad.addColorStop(0, '#efede7'); grad.addColorStop(1, '#d6d2c9'); } else { grad.addColorStop(0, '#2d2d32'); grad.addColorStop(1, '#121214'); }
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  const pass = (color, dx, dy, op) => {
    scene.overrideMaterial = color ? new THREE.MeshLambertMaterial({ color }) : null;
    r.render(scene, cam); ctx.globalCompositeOperation = op; ctx.drawImage(canvas, dx, dy);
  };
  if (glitch === '1') { // white towers with RGB ghosts on charcoal
    pass('#f2222e', d, 0, 'screen'); pass('#22e4ff', -d, d * 0.3, 'screen'); pass('#ffe600', 0, -d * 0.8, 'screen'); pass('#2433ff', -d * 0.6, d, 'screen');
    pass('#ffffff', 0, 0, 'source-over');
  } else if (glitch === '2') { // print-colour towers with cyan/magenta ghosts on charcoal
    pass('#22e4ff', -d, d * 0.3, 'screen'); pass('#ff2fa8', d, 0, 'screen'); pass(null, 0, 0, 'source-over');
  } else if (glitch === '3') { // two-plate overprint on paper: cyan + magenta, overlaps go violet
    pass('#3ad8ff', -d * 1.6, d * 0.4, 'multiply'); pass('#ff3da0', d * 1.6, -d * 0.4, 'multiply');
  } else { // three light plates on paper, wide misregistration
    pass('#fff04a', 0, d * 2, 'multiply'); pass('#ff7ccc', d * 2, -d * 0.6, 'multiply'); pass('#6fe6ff', -d * 2, -d * 0.6, 'multiply');
  }
  scene.overrideMaterial = null;
}
document.title = 'ready';
</script>
</body></html>
